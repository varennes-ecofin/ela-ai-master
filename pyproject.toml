[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ela-ai"
version = "2.0.0a13"
description = "ELA — Econometrics Learning Assistant (RAG chatbot for master-level econometrics courses)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Proprietary — pedagogical use" }
authors = [{ name = "Gilles de Truchis" }]

dependencies = [
  # Chat front-end
  "chainlit==2.12.0",
  # LangChain (agent: langchain + langgraph)
  "langchain==1.4.6",
  "langchain-core==1.6.10",
  "langchain-huggingface==1.2.3",
  "langchain-openai==1.7.1",
  "langgraph==1.2.16",
  # Vector store (pgvector via SQLAlchemy; Chroma as fallback), embeddings, reranking
  "chromadb==1.5.9",
  "sentence-transformers==5.7.0",
  "transformers==4.57.6",
  "rank-bm25==0.2.2",
  "flashrank==0.2.10",
  # Configuration
  "python-dotenv==1.2.4",
  "pyyaml>=6.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  # Database
  "sqlalchemy[asyncio]==2.0.54",
  "alembic==1.20.0",
  "asyncpg==0.32.0",
  "psycopg2-binary==2.9.13",
  "bcrypt==5.0.0",
  # Misc
  "aiofiles==25.1.0",
  "watchfiles==1.1.1",
]

[project.optional-dependencies]
admin = [
  "streamlit==1.65.0",
  "pandas==2.3.3",
  "plotly==6.9.0",
]
backoffice = [
  # fastapi / uvicorn / python-multipart are already pinned by chainlit (same versions)
  "fastapi==0.158.1",
  "uvicorn[standard]==0.54.0",
  "python-multipart==0.0.32",
  "jinja2==3.1.6",
  "itsdangerous==2.2.0",
]
tracing = [
  "langfuse>=4,<6",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "pre-commit>=3.8",
]

[project.scripts]
ela-ingest = "ela.ingestion.pipeline:main"
ela-users = "ela.cli.users:main"
ela-hash = "ela.cli.hash:main"
ela-db = "ela.db.migrate:main"
ela-eval = "ela.eval.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ela.db.migrations" = ["script.py.mako", "versions/*.py"]
"ela.agent.prompts" = ["*.md"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "apps", "tests"]
extend-exclude = ["Other", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "D"]
ignore = [
  "D100", "D104", "D105", "D107",   # module/package/magic-method docstrings
  "D203", "D213",                   # conflicting docstring styles
  "E402",                           # imports after the Windows event-loop fix
  "N999",                           # non-PEP8 module names (legacy admin views)
  "D413",                           # no blank line after the last docstring section
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"apps/admin/*" = ["D", "E501"]
"apps/backoffice/*" = ["B008", "E501"]  # `Depends(...)` in defaults is the FastAPI idiom ; French messages
"src/ela/retrieval/store.py" = ["D102"]      # ChunkStore protocol documents the interface once
"src/ela/retrieval/rerank.py" = ["D102"]     # Reranker protocol documents the interface once
"src/ela/retrieval/embeddings.py" = ["D102"]
"src/ela/cli/*" = ["E501"]
"src/ela/prompts.py" = ["E501", "W291"]
"src/ela/eval/legacy_pipeline.py" = ["E501"]  # frozen Phase-2 prompts
"src/ela/agent/tools.py" = ["E501"]           # French messages returned to the model
"apps/chat/app.py" = ["D103"]  # Chainlit callbacks are self-describing
"apps/sandbox/server.py" = ["D102"]  # http.server handler methods
"src/ela/db/migrations/*" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
