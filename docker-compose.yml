# ============================================================
# ELA AI — Docker Compose
#
# Deux modes de déploiement :
#  - serveur avec un reverse proxy DÉJÀ en place (cas du VPS, où un Caddy
#    sert déjà une autre application) : `docker compose up -d`
#    → app et admin écoutent uniquement sur 127.0.0.1 (8000 / 8501) ;
#      ajouter l'extrait deploy/caddy-ela.snippet au Caddyfile existant.
#  - serveur dédié sans reverse proxy : `docker compose --profile standalone up -d`
#    → le service `caddy` ci-dessous prend les ports 80/443 (HTTPS automatique).
# ============================================================
services:
  # --- Reverse proxy HTTPS (profil "standalone" uniquement) ---
  caddy:
    image: caddy:2
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
      - ADMIN_BASIC_AUTH_USER=${ADMIN_BASIC_AUTH_USER:-admin}
      - ADMIN_BASIC_AUTH_HASH=${ADMIN_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - admin

  # --- Base de données (PostgreSQL 15 + extension pgvector, prête pour la phase 2) ---
  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Application ELA (Chainlit) — accessible uniquement via Caddy ---
  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # Accessible depuis l'hôte seulement (reverse proxy externe) ; jamais exposé sur Internet
    ports:
      - "127.0.0.1:${ELA_APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Force l'URL DB Docker (écrase celle du .env)
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LOG_JSON=true
    volumes:
      # data/ : cours LaTeX, base vectorielle, caches de modèles (HF, FlashRank)
      - ./data:/app/data
      - ./.files_ela:/app/.files_ela
      - ./public:/app/public

  # --- Backoffice Admin (Streamlit) — accessible uniquement via Caddy (/admin) ---
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: ela-admin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ELA_ADMIN_PORT:-8501}:8501"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.baseUrlPath", "admin"]
    volumes:
      - ./data:/app/data

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
