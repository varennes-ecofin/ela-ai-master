# ============================================================
# ELA AI — Docker Compose
#
# Deux modes de déploiement :
#  - serveur avec un reverse proxy DÉJÀ en place (cas du VPS, où un Caddy
#    sert déjà une autre application) : `docker compose up -d`
#    → app et backoffice écoutent uniquement sur 127.0.0.1 (8000 / 8502) ;
#      ajouter l'extrait deploy/caddy-ela.snippet au Caddyfile existant.
#  - serveur dédié sans reverse proxy : `docker compose --profile standalone up -d`
#    → le service `caddy` ci-dessous prend les ports 80/443 (HTTPS automatique).
# ============================================================
services:
  # --- Reverse proxy HTTPS (profil "standalone" uniquement) ---
  caddy:
    image: caddy:2
    profiles: ["standalone"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - backoffice

  # --- Base de données (PostgreSQL 15 + extension pgvector, prête pour la phase 2) ---
  db:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Application ELA (Chainlit) — accessible uniquement via Caddy ---
  app:
    build: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
    # Accessible depuis l'hôte seulement (reverse proxy externe) ; jamais exposé sur Internet
    ports:
      - "127.0.0.1:${ELA_APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Force l'URL DB Docker (écrase celle du .env)
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LOG_JSON=true
    volumes:
      # data/ : cours LaTeX, base vectorielle, caches de modèles (HF, FlashRank)
      - ./data:/app/data
      - ./.files_ela:/app/.files_ela
      - ./public:/app/public
    networks:
      - default
      - sandbox_net

  # --- Bac à sable d'exécution (Atelier Code 2.0) ---
  # Exécute les scripts Python des étudiants. Joignable uniquement par `app` sur un réseau
  # interne (aucun accès Internet), non-root, système de fichiers en lecture seule, limites
  # mémoire/processus. Activer côté app avec SANDBOX_URL=http://sandbox:8080 dans le .env.
  sandbox:
    build: ./apps/sandbox
    container_name: ela-sandbox
    restart: unless-stopped
    networks:
      - sandbox_net
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    environment:
      - SANDBOX_TIMEOUT=${SANDBOX_TIMEOUT_SECONDS:-30}
      - SANDBOX_MEMORY_MB=512
    mem_limit: 1g
    pids_limit: 128
    cpus: "1.0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # --- Backoffice (FastAPI + HTMX, phase 5) — servi par Caddy sous /backoffice ---
  # Sessions signées (BACKOFFICE_SECRET_KEY dans le .env) ; exécute aussi les jobs d'ingestion
  # et d'évaluation (lot 5.5 : `ela-eval` en processus enfant, rapports dans ./eval/reports,
  # accès au bac à sable via sandbox_net pour `ela-eval code`, même SANDBOX_URL que `app`).
  backoffice:
    build:
      context: .
      dockerfile: apps/backoffice/Dockerfile
    container_name: ela-backoffice
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${ELA_BACKOFFICE_PORT:-8502}:8080"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - ADMIN_DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - LOG_JSON=true
    volumes:
      - ./data:/app/data
      # eval/ : jeu de questions (questions.yaml) et rapports JSON (reports/, hors git) ;
      # le dossier doit appartenir à l'uid 1000 (utilisateur `ela` du conteneur)
      - ./eval:/app/eval
    networks:
      - default
      - sandbox_net

networks:
  default:
  sandbox_net:
    internal: true   # pas de route vers l'extérieur : le bac à sable n'a aucun accès réseau

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
