name: CI

on:
  push:
    branches: [main, modernisation]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: ela
          POSTGRES_PASSWORD: ela
          POSTGRES_DB: ela_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ela -d ela_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Same install as the Docker images (CPU-only torch); matplotlib for the sandbox runner tests.
      - name: Install
        run: |
          uv venv
          uv pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,admin]" matplotlib
      - name: Lint
        run: |
          uv run ruff check src apps tests
          uv run ruff format --check src apps tests
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql://ela:ela@localhost:5432/ela_test
        run: uv run pytest -q
